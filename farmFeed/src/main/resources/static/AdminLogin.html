<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin Login | FarmFeed</title>

  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" />
  <!-- Bootstrap Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet" />
  
  <style>
    :root {
      --primary-green: #28a745;
      --dark-green: #1e7d3f;
      --light-green: #e8f5e9;
    }

    body { 
      background: linear-gradient(135deg, #e8f5e9 0%, #ffffff 100%);
      font-family: 'Inter', sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .login-container {
      width: 100%;
      max-width: 420px;
      padding: 20px;
    }

    .login-card {
      background: white;
      border-radius: 16px;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.1);
      padding: 40px 30px;
      border: 1px solid #eee;
    }

    .login-header {
      text-align: center;
      margin-bottom: 30px;
    }

    .logo-icon {
      width: 70px;
      height: 70px;
      background: var(--primary-green);
      border-radius: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 15px;
      font-size: 32px;
      color: white;
      box-shadow: 0 8px 16px rgba(40, 167, 69, 0.2);
    }

    .login-header h1 {
      font-size: 24px;
      font-weight: 700;
      color: #333;
    }

    .form-control {
      padding: 12px 16px;
      border-radius: 10px;
      border: 1.5px solid #eee;
    }

    .form-control:focus {
      border-color: var(--primary-green);
      box-shadow: 0 0 0 3px rgba(40, 167, 69, 0.1);
    }

    .btn-login {
      width: 100%;
      padding: 12px;
      background: var(--primary-green);
      color: white;
      border: none;
      border-radius: 10px;
      font-weight: 600;
      transition: all 0.3s;
    }

    .btn-login:hover {
      background: var(--dark-green);
      transform: translateY(-2px);
    }

    .error-message {
      background: #fff5f5;
      color: #c53030;
      padding: 12px;
      border-radius: 10px;
      margin-bottom: 20px;
      font-size: 14px;
      display: none;
      border: 1px solid #feb2b2;
    }

    .error-message.show { display: block; }
  </style>
  <link rel="stylesheet" href="css/toast.css">
</head>

<body>
  <div class="login-container">
    <div class="login-card">
      <div class="login-header">
        <div class="logo-icon">
          <i class="bi bi-shield-lock"></i>
        </div>
        <h1>Admin Portal</h1>
        <p class="text-muted">Enter credentials to access dashboard</p>
      </div>

      <div id="errorBox" class="error-message"></div>

      <form id="loginForm">
        <div class="mb-3">
          <label class="form-label fw-semibold">Username</label>
          <input type="text" id="username" class="form-control" placeholder="Enter admin username" required>
        </div>
        <div class="mb-4">
          <label class="form-label fw-semibold">Password</label>
          <input type="password" id="password" class="form-control" placeholder="••••••••" data-toggle="password" required>
        </div>
        <button type="submit" class="btn-login mb-3">
          <i class="bi bi-box-arrow-in-right me-2"></i> Login to Dashboard
        </button>
      </form>

      <div class="text-center">
        <p class="text-muted small">Only authorized admins can access this area.</p>
        <a href="AdminSignup.html" class="text-success text-decoration-none fw-semibold small">Create New Admin Account</a>
      </div>
    </div>
  </div>

  <script src="js/config.js"></script>
  <script src="js/password-toggle.js"></script>
  <script>
    const API_URL = window.API_BASE_URL || window.location.origin;

    document.getElementById("loginForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      const btn = e.target.querySelector('button');
      const errorBox = document.getElementById("errorBox");
      
      const username = document.getElementById("username").value;
      const password = document.getElementById("password").value;

      btn.disabled = true;
      btn.innerHTML = '<span class="spinner-border spinner-border-sm me-2"></span> Authenticating...';
      errorBox.classList.remove("show");

      try {
        const response = await fetch(`${API_URL}/api/admin/login`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, password })
        });

        const data = await response.json();

        if (data.success) {
          localStorage.setItem("admin_id", data.adminId);
          localStorage.setItem("user_name", data.username);
          localStorage.setItem("user_type", "admin");
          window.location.href = "AdminDashboard.html";
        } else {
          errorBox.textContent = data.error || "Invalid credentials";
          errorBox.classList.add("show");
          btn.disabled = false;
          btn.innerHTML = '<i class="bi bi-box-arrow-in-right me-2"></i> Login to Dashboard';
        }
      } catch (err) {
        errorBox.textContent = "Server connection failed. Try again later.";
        errorBox.classList.add("show");
        btn.disabled = false;
        btn.innerHTML = '<i class="bi bi-box-arrow-in-right me-2"></i> Login to Dashboard';
      }
    });
  </script>
</body>
</html>

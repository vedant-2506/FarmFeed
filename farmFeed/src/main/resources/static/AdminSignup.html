<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin Sign Up | FarmFeed</title>

  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" />
  <!-- Bootstrap Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet" />
  
  <style>
    :root {
      --primary-green: #28a745;
      --dark-green: #1e7d3f;
      --light-green: #e8f5e9;
    }

    body { 
      background: linear-gradient(135deg, #e8f5e9 0%, #ffffff 100%);
      font-family: 'Inter', sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .signup-container {
      width: 100%;
      max-width: 500px;
      padding: 20px;
    }

    .signup-card {
      background: white;
      border-radius: 16px;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.1);
      padding: 40px 30px;
      border: 1px solid #eee;
    }

    .logo-icon {
      width: 60px;
      height: 60px;
      background: var(--primary-green);
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 15px;
      font-size: 28px;
      color: white;
    }

    .btn-signup {
      width: 100%;
      padding: 12px;
      background: var(--primary-green);
      color: white;
      border: none;
      border-radius: 10px;
      font-weight: 600;
      transition: all 0.3s;
    }

    .btn-signup:hover {
      background: var(--dark-green);
    }

    .error-message {
      background: #fff5f5;
      color: #c53030;
      padding: 12px;
      border-radius: 10px;
      margin-bottom: 20px;
      font-size: 14px;
      display: none;
      border: 1px solid #feb2b2;
    }

    .success-message {
      background: #f0fff4;
      color: #2f855a;
      padding: 12px;
      border-radius: 10px;
      margin-bottom: 20px;
      font-size: 14px;
      display: none;
      border: 1px solid #c6f6d5;
    }
  </style>
  <link rel="stylesheet" href="css/toast.css">
</head>

<body>
  <div class="signup-container">
    <div class="signup-card">
      <div class="text-center mb-4">
        <div class="logo-icon">
          <i class="bi bi-person-plus"></i>
        </div>
        <h2 class="fw-bold">Admin Registration</h2>
        <p class="text-muted" id="signupSubtext">Create a new administrator account</p>
      </div>

      <div id="errorBox" class="error-message"></div>
      <div id="successBox" class="success-message"></div>

      <form id="signupForm">
        <div class="row g-3">
          <div class="col-12">
            <label class="form-label fw-semibold">Full Name</label>
            <input type="text" id="fullName" class="form-control" placeholder="Vedant Divate" required>
          </div>
          <div class="col-md-6">
            <label class="form-label fw-semibold">Username</label>
            <input type="text" id="username" class="form-control" placeholder="swamidiavte2506" required>
          </div>
          <div class="col-md-6">
            <label class="form-label fw-semibold">Email</label>
            <input type="email" id="email" class="form-control" placeholder="swami@2506" required>
          </div>
          <div class="col-12">
            <label class="form-label fw-semibold">Password</label>
            <input type="password" id="password" class="form-control" placeholder="••••••••" data-toggle="password" required>
          </div>
          <input type="hidden" id="role" value="ADMIN">
        </div>
        <button type="submit" class="btn-signup mt-4">
          <i class="bi bi-shield-check me-2"></i> Register Admin
        </button>
      </form>

      <div class="text-center mt-4">
        <a href="AdminLogin.html" class="text-success text-decoration-none fw-semibold small">Back to Login</a>
      </div>
    </div>
  </div>

  <script src="js/config.js"></script>
  <script src="js/password-toggle.js"></script>
  <script>
    const API_URL = window.API_BASE_URL || window.location.origin;
    const adminId = localStorage.getItem("admin_id");

    // Check if any admins exist before restricting access
    async function checkAdminCount() {
        try {
            const res = await fetch(`${API_URL}/api/admin/statistics`);
            const data = await res.json();
            const count = data.data.totalAdmins;
            
            console.log("Admin Check - Count:", count, "Logged In AdminID:", adminId);
            
            // Only block if admins exist AND requester is not logged in as an admin
            if (count > 0 && !adminId) {
                alert("Access Denied: Only existing administrators can create new admin accounts. Please log in as an admin first.");
                window.location.href = "AdminLogin.html";
            }
        } catch (e) {
            console.error("Auth check failed", e);
        }
    }

    checkAdminCount();

    if (adminId) {
      document.getElementById("signupSubtext").textContent = "Logged in as Admin. You can now register additional administrators.";
    }

    document.getElementById("signupForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      const btn = e.target.querySelector('button');
      const errorBox = document.getElementById("errorBox");
      const successBox = document.getElementById("successBox");
      
      const payload = {
        fullName: document.getElementById("fullName").value,
        username: document.getElementById("username").value,
        email: document.getElementById("email").value,
        password: document.getElementById("password").value,
        role: document.getElementById("role").value,
        isActive: true
      };

      btn.disabled = true;
      btn.innerHTML = '<span class="spinner-border spinner-border-sm me-2"></span> Registering...';
      errorBox.style.display = "none";

      try {
        let endpoint = `${API_URL}/api/admin/register`;
        if (adminId) {
          endpoint = `${API_URL}/api/admin/${adminId}/create-admin`;
        }

        const response = await fetch(endpoint, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });

        const data = await response.json();

        if (data.success) {
          successBox.textContent = data.message || "Admin registered successfully!";
          successBox.style.display = "block";
          setTimeout(() => {
            if (adminId) window.location.href = "AdminDashboard.html";
            else window.location.href = "AdminLogin.html";
          }, 2000);
        } else {
          errorBox.textContent = data.error || "Registration failed";
          errorBox.style.display = "block";
          btn.disabled = false;
          btn.innerHTML = '<i class="bi bi-shield-check me-2"></i> Register Admin';
        }
      } catch (err) {
        errorBox.textContent = "Server connection failed.";
        errorBox.style.display = "block";
        btn.disabled = false;
        btn.innerHTML = '<i class="bi bi-shield-check me-2"></i> Register Admin';
      }
    });
  </script>
</body>
</html>

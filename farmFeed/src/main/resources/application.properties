server.port=${PORT:8080}
server.servlet.context-path=/

# Database Configuration (use environment variables in deployment)
# Supports both full URL (DB_URL) and component-based (DB_HOST, DB_PORT, etc.)
spring.datasource.url=${DB_URL:jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:farmfeed}?useSSL=${DB_USE_SSL:false}&requireSSL=${DB_REQUIRE_SSL:false}&allowPublicKeyRetrieval=true&serverTimezone=UTC&characterEncoding=utf8mb4}
spring.datasource.username=${DB_USER:farmfeed}
spring.datasource.password=${DB_PASSWORD:${DB_PASS:farmfeed_password}}
spring.datasource.driverClassName=${DB_DRIVER:com.mysql.cj.jdbc.Driver}

# JPA/Hibernate Configuration
spring.jpa.database-platform=${JPA_DIALECT:org.hibernate.dialect.MySQLDialect}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
spring.jpa.hibernate.naming.implicit-strategy=org.hibernate.boot.model.naming.ImplicitNamingStrategyLegacyJpaImpl

spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.batch_size=20
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true

# SQL INIT
spring.sql.init.mode=never

# LOGGING
logging.level.root=WARN
logging.level.com.example.farmFeed=INFO
logging.level.org.springframework.web=WARN
logging.level.org.hibernate.SQL=WARN

# HIKARI CONNECTION POOL
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=20000

# APPLICATION
spring.application.name=FarmFeed
spring.jackson.serialization.write-dates-as-timestamps=false

# CORS
spring.web.cors.allowed-origins=*
spring.web.cors.allowed-methods=GET,POST,PUT,DELETE,PATCH,OPTIONS
spring.web.cors.allowed-headers=*
spring.web.cors.max-age=3600

# Seed demo data when products table is empty
farmfeed.seed.enabled=true
farmfeed.seed.product-count=1000
